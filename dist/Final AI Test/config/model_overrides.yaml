# ---------------------------------------------------------------------------
# إعدادات موصى بها لكل موديل — تُقرأ من scripts/model_settings.py
#
# المبدأ:
#   · إعدادات الامتحان (temp=0 · seed=20261106 · ctx=4096 · max_tokens=1200
#     · الـ system prompt · المصحّح) مثبّتة ومش بتتغيّر — عشان المقارنة بين
#     الموديلات تبقى صحيحة.
#   · توصيات المطوّر بتتطبّق على الإعدادات التشغيلية اللي مش بتأثر على الدرجة:
#     قالب المحادثة · نوع KV cache · flash-attn · عدد الطبقات على الـ GPU
#     · threads · device · أي flags إضافية للـ llama-server.
#   · توصيات التوليد (temperature / top_p / top_k / min_p) بتتعرض في التقرير
#     بس، لأن تطبيقها بيكسر الحتمية (temp=0) — إلا لو فُعّل
#     --apply-recommended-sampling knowingly.
#
# المطابقة بالترتيب: repo id مطابق ← glob pattern ← family ← defaults
# ---------------------------------------------------------------------------

defaults:
  kv_cache_type: f16
  flash_attn: ""            # on | off | auto | "" (فاضي = اختيار السيرفر الافتراضي)
  n_gpu_layers: null        # null = القيمة اللي يجيبها الـ CLI/الـ fit
  threads: null
  device: ""                # مثال: Vulkan0 · CUDA0 · "" (auto)
  extra_server_args: []
  chat_template: null       # null = قالب الامتحان
  recommended_sampling:     # للتوثيق فقط (لا تُطبَّق تلقائياً)
    temperature: null
    top_p: null
    top_k: null
    min_p: null
    notes: ""
  notes: ""

models:
  # ── Qwen3.5 (العائلة اللي ورقة الامتحان مبنية عليها) ────────────────────
  "unsloth/Qwen3.5-4B-GGUF":
    chat_template: templates/qwen35_egyptian_nothink.jinja
    kv_cache_type: f16
    flash_attn: "on"
    n_gpu_layers: 32
    recommended_sampling:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      notes: "توصيات المطوّر (Qwen3.5) — ورقة الامتحان تتطلب temp=0 للتصحيح الحتمي."
    notes: "موديل خط الأساس المرجعي (61.6/100)."

  "*/Qwen3.5-4B-GGUF":
    chat_template: templates/qwen35_egyptian_nothink.jinja
    kv_cache_type: f16
    flash_attn: "on"
    recommended_sampling:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      notes: "عائلة Qwen3.5 — نفس توصيات المطوّر."

  # ── أمثلة لإضافة موديل جديد ─────────────────────────────────────────────
