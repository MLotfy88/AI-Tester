# ---------------------------------------------------------------------------
# إعدادات موصى بها لكل موديل — تُقرأ من scripts/model_settings.py
#
# المبدأ:
#   · إعدادات الامتحان (temp=0.6 · top_p=0.95 · seed=1234 · الـ system prompt
#     · المصحّح) مثبّتة ومش بتتغيّر — عشان المقارنة بين الموديلات تبقى صحيحة.
#   · `ctx_size` (16384) و`max_tokens` (12000) مش مثبّتين — بيتقبلوا من الـCLI
#     لكل تشغيل بـ`--ctx` و`--max-tokens`.
#     ⚠ لازم max_tokens يدخل جوه ctx (مع هامش ~512 توكن للـprompt)،
#       وإلا llama-server بيرفض الطلب والرد بيطلع فاضي.
#   · توصيات المطوّر بتتطبّق على الإعدادات التشغيلية اللي مش بتأثر على الدرجة:
#     قالب المحادثة · نوع KV cache · flash-attn · عدد الطبقات على الـ GPU
#     · threads · device · أي flags إضافية للـ llama-server.
#   · توصيات التوليد (temperature / top_p / top_k / min_p) بتتعرض في التقرير
#     بس، لأن تطبيقها بيكسر الحتمية (seed + إعدادات ورقة الامتحان) — إلا لو
#     فُعّل --apply-recommended-sampling knowingly.
#
# المطابقة بالترتيب: repo id مطابق ← glob pattern ← family ← defaults
# ---------------------------------------------------------------------------

defaults:
  kv_cache_type: f16
  flash_attn: ""            # on | off | auto | "" (فاضي = اختيار السيرفر الافتراضي)
  n_gpu_layers: null        # null = القيمة اللي يجيبها الـ CLI/الـ fit
  threads: null
  device: ""                # مثال: Vulkan0 · CUDA0 · "" (auto)
  extra_server_args: []
  chat_template: null       # null = قالب الامتحان
  recommended_sampling:     # للتوثيق فقط (لا تُطبَّق تلقائياً)
    temperature: null
    top_p: null
    top_k: null
    min_p: null
    notes: ""
  notes: ""

models:
  # ── أمثلة لإضافة موديل جديد ─────────────────────────────────────────────
  # "owner/Some-Model-GGUF":
  #   chat_template: templates/qwen35_egyptian_nothink.jinja
  #   kv_cache_type: q8_0
  #   flash_attn: "on"
  #   n_gpu_layers: 28
  #   extra_server_args: ["--no-context-shift"]
  #   recommended_sampling:
  #     temperature: 0.6
  #     top_p: 0.95
  #     notes: "من README بتاع المطوّر."
  #   notes: "سبب الاختيار."
  #
  # ⚠ `n_gpu_layers: null` (أو غايب) ⇒ القيمة تجيب من حساب الـ fit
  #   (ميزانية VRAM بعد الـ ballast). متحطّش رقم ثابت إلا لو عارف إنك عايزه.
