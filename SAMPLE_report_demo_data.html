<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Bench Studio — مقارنة موديلين GGUF محلياً</title>
<style>
/* ============================================================================
   Bench Studio — design system
   dark glass dashboard / aurora background / green→red heat scale
   ========================================================================== */
:root{
  --font:"Segoe UI",Tahoma,"Noto Kufi Arabic","Cairo",system-ui,-apple-system,sans-serif,
       "Segoe UI Emoji","Noto Color Emoji","Apple Color Emoji";
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  --bg:#060912; --fg:#e9eefc; --mut:#93a1bd; --dim:#64748b;
  --panel:rgba(17,25,42,.66); --panel2:rgba(11,17,30,.62); --inset:rgba(5,8,15,.55);
  --bd:rgba(148,163,184,.16); --bd2:rgba(148,163,184,.30);
  --hdr:rgba(6,9,18,.74);
  --cy:#22d3ee; --vi:#38bdf8; --bl:#60a5fa; --gr:#34d399; --am:#fbbf24; --rd:#fb7185; --fu:#2dd4bf;
  --grad:linear-gradient(135deg,#22d3ee 0%,#0ea5e9 50%,#14b8a6 100%);
  --grad2:linear-gradient(135deg,#34d399,#22d3ee);
  --gradw:linear-gradient(135deg,#fb7185,#fb923c 55%,#fbbf24);
  --ok:#34d399; --bad:#fb7185; --warn:#fbbf24;
  --okfg:#6ee7b7; --badfg:#fda4af; --warnfg:#fcd34d;
  --shadow:0 22px 60px -26px rgba(0,0,0,.95);
  --r:18px;
}
html[data-theme=light]{
  --bg:#eef2f9; --fg:#131a2a; --mut:#5b6883; --dim:#7b879f;
  --panel:rgba(255,255,255,.86); --panel2:rgba(255,255,255,.72); --inset:rgba(233,238,247,.9);
  --bd:rgba(15,23,42,.14); --bd2:rgba(15,23,42,.26); --hdr:rgba(240,244,251,.86);
  --shadow:0 16px 40px -24px rgba(15,23,42,.5);
  --okfg:#047857; --badfg:#be123c; --warnfg:#a16207;
}
html[data-theme=light] .orb{opacity:.13}
html[data-theme=light] .kpi::after{opacity:.10}
html[data-theme=light] .bg::after{opacity:.6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:14px/1.65 var(--font);color:var(--fg);background:var(--bg);
     overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
b,strong{font-weight:750}
code{font:12px var(--mono);background:var(--inset);padding:1px 6px;border-radius:6px;color:var(--cy)}
hr{border:0;border-top:1px solid var(--bd);margin:14px 0}

/* ---------------------------------------------------------- background --- */
.bg{position:fixed;inset:0;z-index:-3;background:
   radial-gradient(1100px 640px at 88% -12%,rgba(14,165,233,.30),transparent 62%),
   radial-gradient(880px 560px at 2% 6%,rgba(34,211,238,.22),transparent 60%),
   radial-gradient(1000px 760px at 46% 116%,rgba(20,184,166,.20),transparent 62%),
   linear-gradient(180deg,#050810,#070c17 45%,#050810)}
html[data-theme=light] .bg{background:
   radial-gradient(1000px 600px at 88% -12%,rgba(14,165,233,.16),transparent 62%),
   radial-gradient(820px 520px at 2% 6%,rgba(34,211,238,.16),transparent 60%),
   radial-gradient(900px 700px at 46% 116%,rgba(20,184,166,.12),transparent 62%),
   linear-gradient(180deg,#f4f7fd,#e9eef8)}
.bg::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(148,163,184,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(148,163,184,.055) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 12%,transparent 78%);
          mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 12%,transparent 78%)}
.orb{position:fixed;border-radius:50%;filter:blur(96px);opacity:.4;z-index:-2;pointer-events:none;
     animation:float 22s ease-in-out infinite}
.orb.a{width:420px;height:420px;top:-120px;inset-inline-end:-90px;background:#22d3ee}
.orb.b{width:380px;height:380px;bottom:-140px;inset-inline-start:-80px;background:#0d9488;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,34px,0) scale(1.07)}}

/* ------------------------------------------------------------- header --- */
header{position:sticky;top:0;z-index:40;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:11px 20px;background:var(--hdr);backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 8px 24px -8px rgba(14,165,233,.95);position:relative;overflow:hidden;flex:0 0 auto}
.logo svg{width:19px;height:19px;fill:#fff;position:relative;z-index:1}
.logo::after{content:"";position:absolute;inset:0;z-index:2;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.6) 47%,transparent 62%);
  transform:translateX(-130%);animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,72%{transform:translateX(-130%)}88%,100%{transform:translateX(130%)}}
.brand h1{margin:0;font-size:16.5px;font-weight:800;letter-spacing:.2px;
  background:linear-gradient(90deg,#fff,#7dd3fc 55%,#5eead4);-webkit-background-clip:text;
  background-clip:text;color:transparent}
html[data-theme=light] .brand h1{background:linear-gradient(90deg,#0f172a,#0e7490);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10.5px;color:var(--mut);font-weight:600;margin-top:-3px}

nav{display:flex;gap:3px;padding:4px;border-radius:15px;background:var(--panel2);
  border:1px solid var(--bd);flex-wrap:wrap}
nav button{border:0;background:transparent;color:var(--mut);padding:8px 15px;border-radius:11px;
  cursor:pointer;font:700 12.8px var(--font);transition:.25s;white-space:nowrap}
nav button:hover{color:var(--fg);background:rgba(148,163,184,.10)}
nav button.on{color:#fff;background:var(--grad);box-shadow:0 8px 22px -10px rgba(14,165,233,1)}
html[data-theme=light] nav button.on{color:#fff}

.pods{margin-inline-start:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pod{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--bd);font-size:11.8px;color:var(--mut);max-width:290px}
.pod b{color:var(--fg);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .ic{font-size:12px;opacity:.85}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.dot.ok{background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.65);animation:pulse 2.4s infinite}
.dot.bad{background:var(--bad);box-shadow:0 0 0 0 rgba(251,113,133,.65);animation:pulse 1.5s infinite}
.dot.warn{background:var(--warn);box-shadow:0 0 0 0 rgba(251,191,36,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.dot.ok{color:rgba(52,211,153,.6)}.dot.bad{color:rgba(251,113,133,.6)}.dot.warn{color:rgba(251,191,36,.55)}
#theme{width:36px;height:36px;border-radius:11px;border:1px solid var(--bd);background:var(--panel2);
  color:var(--fg);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.25s}
#theme:hover{border-color:rgba(34,211,238,.55);transform:rotate(14deg)}

/* ---------------------------------------------------------- report bar --- */
.rbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:11px 20px;font-size:12.5px;
  color:var(--mut);border-bottom:1px solid var(--bd);
  background:linear-gradient(90deg,rgba(34,211,238,.13),rgba(20,184,166,.12))}
.rbar[hidden]{display:none}
.rbar b{color:var(--fg);font-family:var(--mono)}

/* --------------------------------------------------------------- main --- */
main{padding:20px;max-width:1460px;margin:auto}
.tab{display:none}.tab.on{display:block;animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{position:relative;background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);
  padding:18px;margin:14px 0;backdrop-filter:blur(16px) saturate(1.35);
  -webkit-backdrop-filter:blur(16px) saturate(1.35);box-shadow:var(--shadow);
  transition:border-color .3s,transform .3s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.26),transparent)}
html[data-theme=light] .card::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent)}
.card:hover{border-color:var(--bd2)}
.card.in{animation:rise .55s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 13px;font-size:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h3::before{content:"";width:4px;height:17px;border-radius:3px;background:var(--grad);flex:0 0 auto}
.card h3 .tag{margin-inline-start:auto;font:600 11px var(--font);color:var(--mut);
  background:var(--panel2);border:1px solid var(--bd);padding:3px 9px;border-radius:999px}
.card.accent{border-color:rgba(34,211,238,.28)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.small{font-size:12.2px}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.ok{color:var(--okfg)}.bad{color:var(--badfg)}.warn{color:var(--warnfg)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------- inputs --- */
label{display:block;margin:9px 0;font-size:12.3px;color:var(--mut);font-weight:600}
label>span.hint{display:block;font-weight:400;color:var(--dim);font-size:11.3px;margin-top:1px}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;padding:10px 12px;margin-top:5px;background:var(--inset);color:var(--fg);
  border:1px solid var(--bd);border-radius:11px;font:inherit;transition:.22s}
textarea{min-height:132px;font:12.4px/1.7 var(--mono);resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--bd2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(34,211,238,.65);
  box-shadow:0 0 0 3px rgba(34,211,238,.15);background:var(--inset)}
input[type=checkbox],input[type=radio]{width:auto;margin:0;margin-inline-end:8px;accent-color:#22d3ee;
  vertical-align:-2px;cursor:pointer}
label.ck{display:flex;align-items:center;gap:2px;padding:9px 12px;border-radius:11px;
  background:var(--panel2);border:1px solid var(--bd);cursor:pointer;transition:.22s;font-weight:600;color:var(--fg)}
label.ck:hover{border-color:rgba(34,211,238,.45);transform:translateY(-1px)}
label.ck:has(input:checked){border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.09)}
label.ck .mut{font-weight:400}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),
  linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(0% + 14px) 18px,calc(0% + 19px) 18px;background-size:5px 5px;background-repeat:no-repeat}

/* ------------------------------------------------------------ buttons --- */
button{font-family:var(--font)}
button.act,button.ghost,button.danger{cursor:pointer;font:700 13.2px var(--font);padding:11px 18px;
  border-radius:12px;transition:.24s;display:inline-flex;align-items:center;gap:8px;border:0}
button.act{background:var(--grad);color:#fff;box-shadow:0 12px 28px -14px rgba(14,165,233,1)}
button.act:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 36px -14px rgba(20,184,166,1)}
button.ghost{background:var(--panel2);border:1px solid var(--bd2);color:var(--fg)}
button.ghost:hover:not(:disabled){border-color:rgba(34,211,238,.6);color:var(--fg);transform:translateY(-2px)}
button.danger{background:linear-gradient(135deg,#f43f5e,#be123c);color:#fff;
  box-shadow:0 12px 28px -16px rgba(244,63,94,1)}
button.danger:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 34px -14px rgba(244,63,94,.9)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
button:active:not(:disabled){transform:translateY(0) scale(.985)}
button.small{padding:6px 11px;font-size:11.8px;border-radius:9px}

/* -------------------------------------------------------------- pills --- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  font-size:11.4px;font-weight:700;background:rgba(148,163,184,.12);border:1px solid var(--bd);
  color:var(--mut);margin:2px;white-space:nowrap}
.pill.ok{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.38);color:var(--okfg)}
.pill.bad{background:rgba(251,113,133,.15);border-color:rgba(251,113,133,.38);color:var(--badfg)}
.pill.warn{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.38);color:var(--warnfg)}
.pill.cy{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.35);color:#67e8f9}
.pill.vi{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.38);color:#7dd3fc}
html[data-theme=light] .pill.cy{color:#0e7490}html[data-theme=light] .pill.vi{color:#0369a1}

/* --------------------------------------------------------------- KPIs --- */
.otag{font:700 10px var(--font);padding:1px 8px;border-radius:99px;margin-inline-start:6px;white-space:nowrap}
.otag.t{background:rgba(52,211,153,.16);color:var(--okfg);border:1px solid rgba(52,211,153,.3)}
.otag.g{background:rgba(148,163,184,.13);color:var(--mut);border:1px solid var(--bd)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin:6px 0}
.kpi{position:relative;overflow:hidden;background:var(--panel2);border:1px solid var(--bd);
  border-radius:15px;padding:13px 15px;transition:.28s}
.kpi:hover{transform:translateY(-3px);border-color:var(--bd2);box-shadow:0 18px 36px -22px rgba(0,0,0,.9)}
.kpi::after{content:"";position:absolute;inset-inline-end:-26px;top:-30px;width:86px;height:86px;
  border-radius:50%;background:var(--acc,var(--grad));opacity:.16;filter:blur(4px)}
.k-lab{font-size:10.8px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;font-weight:700}
.k-val{font:800 25px/1.25 var(--mono);margin-top:3px;font-variant-numeric:tabular-nums;color:var(--fg)}
.k-val.acc{color:var(--acctxt,#fff)}
.k-sub{font-size:11.3px;color:var(--dim);margin-top:1px}

/* -------------------------------------------------------------- gauges --- */
.gauge{position:relative;display:grid;place-items:center;flex:0 0 auto}
.gauge svg{position:absolute;inset:0;overflow:visible}
.g-track{fill:none;stroke:rgba(148,163,184,.17);stroke-width:9}
.g-val{fill:none;stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;
  filter:drop-shadow(0 0 7px currentColor);animation:gdash 1.2s cubic-bezier(.2,.85,.25,1) both}
@keyframes gdash{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--off)}}
.g-mid{position:relative;text-align:center;line-height:1.1}
.g-num{font:800 25px var(--mono);font-variant-numeric:tabular-nums}
.g-pct{font:700 12px var(--mono);opacity:.7}
.g-mid i{display:block;font-style:normal;font-size:10.6px;color:var(--mut);margin-top:3px;max-width:118px}

/* --------------------------------------------------- model compare card --- */
.mcard{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:17px;backdrop-filter:blur(14px);box-shadow:var(--shadow);
  transition:.3s;--acc:var(--grad)}
.mcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc);opacity:.9}
.mcard:hover{transform:translateY(-4px);border-color:var(--bd2);box-shadow:0 28px 60px -30px rgba(0,0,0,1)}
.mcard.in{animation:rise .55s cubic-bezier(.2,.8,.25,1) both}
.mhead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.mtitle{min-width:0}
.mtitle b{display:block;font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.mtitle span{font-size:11.6px;color:var(--mut)}
.mrow{display:flex;align-items:baseline;gap:9px;padding:6px 0;font-size:12.4px;
  border-bottom:1px dashed rgba(148,163,184,.15)}
.mrow:last-child{border-bottom:0}
.mrow span{color:var(--mut)}
.mrow b{margin-inline-start:auto;font:700 13.4px var(--mono);font-variant-numeric:tabular-nums;
  direction:ltr;unicode-bidi:isolate}
.mrow i{font-style:normal;font-size:10.8px;color:var(--dim)}
.delta{font:700 11.4px var(--mono);padding:1px 7px;border-radius:7px}
.delta.up{background:rgba(52,211,153,.16);color:var(--okfg)}
.delta.dn{background:rgba(251,113,133,.16);color:var(--badfg)}
.delta.eq{background:rgba(148,163,184,.14);color:var(--mut)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:14px}

/* --------------------------------------------------------------- bars --- */
.bar,.prog{position:relative;height:12px;border-radius:999px;background:rgba(148,163,184,.15);
  overflow:hidden;border:1px solid var(--bd)}
.bar>div,.prog>i{display:block;height:100%;width:0;border-radius:999px;background:var(--grad);
  transition:width .5s cubic-bezier(.2,.8,.25,1);box-shadow:0 0 20px rgba(14,165,233,.7);position:relative}
.prog>i::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  animation:shimmer 1.7s linear infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.vram{position:relative;height:9px;border-radius:999px;background:rgba(148,163,184,.15);
  overflow:visible;border:1px solid var(--bd)}
.v-fill{height:100%;border-radius:999px;transition:width .5s,background .5s}
.v-mark{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:rgba(251,113,133,.85)}
.v-lab{display:flex;justify-content:space-between;font:600 11px var(--mono);color:var(--mut);margin-top:5px}

/* ---------------------------------------------------------- run panel --- */
.runwrap{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:center}
.ring{position:relative;width:210px;height:210px;display:grid;place-items:center;margin:auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
.r-track{fill:none;stroke:rgba(148,163,184,.15);stroke-width:13}
.r-val{fill:none;stroke:url(#ringgrad);stroke-width:13;stroke-linecap:round;
  transition:stroke-dashoffset .55s cubic-bezier(.2,.8,.25,1);filter:drop-shadow(0 0 10px rgba(34,211,238,.6))}
.r-mid{text-align:center;position:relative}
.r-mid b{font:800 44px/1 var(--mono);font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,#a5f3fc 45%,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme=light] .r-mid b{background:linear-gradient(180deg,#0f172a,#0e7490);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.r-mid span{display:block;font-size:11px;color:var(--mut);margin-top:5px;letter-spacing:.4px}
.steps{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.step{flex:1;min-width:118px;display:flex;gap:9px;align-items:center;padding:9px 11px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--bd);color:var(--mut);font-size:11.6px;font-weight:600;
  transition:.35s}
.step i{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:rgba(148,163,184,.16);font-style:normal;font-size:11px;font-weight:800;transition:.35s}
.step.on{color:var(--fg);border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.09);
  box-shadow:0 10px 28px -18px rgba(34,211,238,1)}
.step.on i{background:var(--grad);color:#fff;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
.step.done{color:var(--fg)}
.step.done i{background:rgba(52,211,153,.22);color:var(--okfg)}
.console{background:#04060c;border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:12px;
  font:11.9px/1.85 var(--mono);max-height:290px;overflow:auto;direction:ltr;text-align:left}
html[data-theme=light] .console{background:#0b1020}
.console .ln{white-space:pre-wrap;word-break:break-word;color:#8ea2c4;animation:lnin .3s ease both}
@keyframes lnin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.console .ln .t{color:#4b5c7a;margin-inline-end:9px}
.console .ln.ph{color:#67e8f9}.console .ln.ok{color:#6ee7b7}
.console .ln.err{color:#fda4af}.console .ln.wa{color:#fcd34d}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--bd);font-size:11.8px;color:var(--mut);font-weight:600}
.chip b{font:700 13px var(--mono);color:var(--fg)}
.chip.hot{border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.10)}
.chip.hot b{color:var(--badfg)}

/* ------------------------------------------------------------- tables --- */
.tbl-wrap{overflow:auto;border:1px solid var(--bd);border-radius:14px;background:var(--panel2);max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.9px}
th{position:sticky;top:0;z-index:2;background:rgba(9,14,25,.94);color:var(--mut);font-size:10.8px;
  text-transform:uppercase;letter-spacing:.5px;font-weight:800;padding:11px 10px;text-align:start;
  border-bottom:1px solid var(--bd);backdrop-filter:blur(8px);white-space:nowrap}
html[data-theme=light] th{background:rgba(255,255,255,.95)}
td{padding:9px 10px;border-bottom:1px solid rgba(148,163,184,.09);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s}
tbody tr:hover td{background:rgba(14,165,233,.09)}
td.heat{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:center;min-width:104px;
  transition:transform .2s}
td.heat:hover{transform:scale(1.03)}
.hnum{display:block;font-size:15.5px;font-weight:800;line-height:1.2}
.hsub{display:block;font-size:10.6px;color:var(--mut);margin-top:1px}
.ci{position:relative;display:block;height:4px;border-radius:3px;background:rgba(148,163,184,.2);
  margin:6px auto 0;max-width:88px;direction:ltr;overflow:hidden}
.ci i{position:absolute;top:0;bottom:0;border-radius:3px;background:currentColor;opacity:.9}
td.empty{color:var(--dim);text-align:center}
.legend{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:11.4px;color:var(--mut);margin-top:10px}
.scale{width:170px;height:9px;border-radius:99px;direction:ltr;
  background:linear-gradient(90deg,#fb7185,#fbbf24 48%,#34d399)}

/* ------------------------------------------------------------ verdict --- */
.verdict{position:relative;border-radius:20px;padding:22px;margin:14px 0;overflow:hidden;
  background:linear-gradient(135deg,rgba(34,211,238,.11),rgba(14,165,233,.11) 50%,rgba(20,184,166,.11));
  border:1px solid var(--bd2);box-shadow:var(--shadow)}
.verdict::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1.5px;background:var(--grad);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.85}
.verdict::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(80px);
  background:rgba(14,165,233,.32);top:-190px;inset-inline-start:-90px;pointer-events:none}
.v-head{position:relative;font:800 19px/1.75 var(--font);margin-bottom:16px;max-width:1000px}
.v-head .vic{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;
  background:var(--grad);color:#fff;font-size:16px;margin-inline-end:10px;vertical-align:-8px;
  box-shadow:0 10px 24px -12px rgba(14,165,233,1)}
.vcounts{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.vc{min-width:104px;padding:11px 15px;border-radius:14px;background:var(--panel2);
  border:1px solid var(--bd);text-align:center;transition:.28s}
.vc:hover{transform:translateY(-3px);border-color:var(--bd2)}
.vc b{display:block;font:800 26px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.vc span{font-size:10.8px;color:var(--mut);font-weight:600;letter-spacing:.3px}
.vsec{border:1px solid var(--bd);border-radius:14px;background:var(--panel2);margin:10px 0;overflow:hidden}
.vsec>summary{cursor:pointer;list-style:none;padding:12px 15px;font-weight:750;font-size:13.2px;
  display:flex;align-items:center;gap:10px;transition:.22s;user-select:none}
.vsec>summary::-webkit-details-marker{display:none}
.vsec>summary:hover{background:rgba(148,163,184,.07)}
.vsec>summary .cv{margin-inline-start:auto;font:700 11px var(--mono);color:var(--mut);
  background:var(--inset);padding:2px 9px;border-radius:999px}
.vsec>summary .ar{transition:transform .3s;font-size:10px;color:var(--mut)}
.vsec[open]>summary .ar{transform:rotate(90deg)}
.vsec .vbody{padding:2px 15px 13px;border-top:1px solid var(--bd)}
.vitem{padding:9px 13px;border-radius:11px;background:var(--inset);border:1px solid var(--bd);
  margin:7px 0;font-size:12.9px;line-height:1.8;transition:.2s}
.vitem:hover{border-color:var(--bd2)}
.vitem::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--acc,var(--cy));margin-inline-end:9px;vertical-align:2px}
.vsec.war{--acc:var(--warn)}.vsec.bad{--acc:var(--bad)}.vsec.mut{--acc:var(--dim)}
.vsec.ok{--acc:var(--ok)}
.empty-sec{color:var(--dim);font-size:12.4px;padding:4px 2px}

/* ------------------------------------------------------------- charts --- */
.chart{position:relative;height:330px;width:100%}
.chart.tall{height:380px}
.chart.sm{height:290px}
.chip-note{font-size:11.6px;color:var(--dim);margin-top:8px;line-height:1.7}

/* ------------------------------------------------------------ answers --- */
.acard{background:var(--panel2);border:1px solid var(--bd);border-radius:15px;padding:14px;margin:11px 0;
  transition:.28s}
.acard:hover{border-color:var(--bd2)}
.acard.diff{border-color:rgba(251,191,36,.55);box-shadow:0 0 0 1px rgba(251,191,36,.14),0 18px 40px -28px rgba(251,191,36,.7)}
.ahead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.ahead b{font:700 12.6px var(--mono);direction:ltr}
.prompt{background:var(--inset);border:1px solid var(--bd);border-radius:11px;padding:9px 12px;
  color:var(--mut);font-size:12.4px;margin:7px 0;max-height:150px;overflow:auto;white-space:pre-wrap}
.answercol{border:1px solid var(--bd);border-radius:13px;padding:11px;background:var(--panel2);
  border-top:3px solid var(--acc,#22d3ee);min-width:0}
.answercol .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.answercol .who b{font-size:12.8px}
.scorebadge{font:800 13px var(--mono);padding:2px 10px;border-radius:8px;margin-inline-start:auto}
.metrics{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
.metrics .m{font:600 10.8px var(--mono);padding:2px 8px;border-radius:7px;background:var(--inset);
  border:1px solid var(--bd);color:var(--mut)}
.ans{background:var(--inset);border:1px solid var(--bd);border-radius:11px;padding:11px;margin-top:7px;
  max-height:340px;overflow:auto;white-space:pre-wrap;font-size:12.8px;line-height:1.8}
details{margin-top:7px}
summary{cursor:pointer;color:var(--mut);font-size:12.2px;font-weight:600}
summary:hover{color:var(--fg)}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12.4px/1.75 var(--mono)}
.thinkbox{background:linear-gradient(180deg,rgba(167,139,250,.10),transparent);
  border:1px solid rgba(167,139,250,.28);border-radius:11px;padding:11px;margin-top:7px;
  max-height:300px;overflow:auto;color:#7dd3fc;font-size:12.3px}
html[data-theme=light] .thinkbox{color:#0369a1}

/* ------------------------------------------------------------- toasts --- */
#toasts{position:fixed;bottom:22px;inset-inline-start:22px;z-index:99;display:flex;
  flex-direction:column;gap:9px;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;
  background:rgba(9,14,25,.95);border:1px solid var(--bd2);box-shadow:0 22px 50px -22px rgba(0,0,0,1);
  font-size:13px;font-weight:600;color:var(--fg);transform:translateY(16px);opacity:0;transition:.34s;
  backdrop-filter:blur(12px);max-width:430px}
.toast.in{transform:none;opacity:1}
.toast .tic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;flex:0 0 auto}
.toast.ok .tic{background:rgba(52,211,153,.2);color:var(--okfg)}
.toast.bad .tic{background:rgba(251,113,133,.2);color:var(--badfg)}
.toast.warn .tic{background:rgba(251,191,36,.2);color:var(--warnfg)}
.toast.info .tic{background:rgba(34,211,238,.2);color:#67e8f9}

#totop{position:fixed;bottom:22px;inset-inline-end:22px;width:46px;height:46px;border-radius:14px;
  border:1px solid var(--bd2);background:var(--panel);color:var(--fg);cursor:pointer;display:none;
  place-items:center;z-index:60;backdrop-filter:blur(12px);font-size:16px;transition:.25s}
#totop.on{display:grid}
#totop:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.6)}

.kv{display:flex;gap:9px;flex-wrap:wrap;font-size:12.3px;color:var(--mut);align-items:center}
.kv b{color:var(--fg)}
.note{font-size:12.2px;color:var(--mut);line-height:1.85;background:var(--panel2);
  border:1px solid var(--bd);border-inline-start:3px solid var(--cy);border-radius:11px;padding:10px 13px;margin-top:11px}
.note.war{border-inline-start-color:var(--warn)}
.subhead{font:800 12px var(--font);color:var(--mut);letter-spacing:.4px;text-transform:uppercase;
  margin:14px 0 7px;display:flex;align-items:center;gap:9px}
.subhead::after{content:"";flex:1;height:1px;background:var(--bd)}
.step-badge{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;
  background:var(--grad);color:#fff;font:800 12px var(--mono);flex:0 0 auto}
.scroll-x{overflow:auto}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(148,163,184,.28);border-radius:99px;
  border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.5);background-clip:content-box}

@media (max-width:900px){
  .grid2,.cols,.runwrap{grid-template-columns:1fr}
  main{padding:14px}
  .ring{width:172px;height:172px}.r-mid b{font-size:36px}
  .brand h1{font-size:15px}
  nav button{padding:7px 11px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  html{scroll-behavior:auto}
}
@media print{
  .bg,.orb,nav,#totop,#toasts,#theme,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card,.kpi,.mcard,.verdict,.vsec,.tbl-wrap{background:#fff!important;box-shadow:none!important;
    border-color:#d7dce6!important;backdrop-filter:none!important;break-inside:avoid}
  .v-head,.k-val,.g-num{color:#000!important;-webkit-text-fill-color:#000}
  main{max-width:none;padding:0}
}

  $$(".tab").forEach((t) => t.classList.toggle("on", t.id === "tab-" + tab));
  $$("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function buildNav(tabs) {
  $("#nav").innerHTML = tabs.map(([id, label]) => `<button data-tab="${id}">${label}</button>`).join("");
  $$("#nav button").forEach((b) => b.onclick = () => { show(b.dataset.tab);
    if (b.dataset.tab === "history") renderHistory();
    if (b.dataset.tab === "compare" && CUR_RUN && !EMB) loadCompare(CUR_RUN); });
}
async function refreshStatus() {
  if (EMB) { $("#status").innerHTML =
    `<span class="pod"><i class="dot ok"></i><b>تقرير محفوظ</b></span>`; return; }
  try {
    const s = await api("/api/status");

    const loaded = (s.loaded_models || []);
    $("#status").innerHTML = `
      <span class="pod"><i class="dot ${lm ? "ok" : "bad"}"></i>LM Studio
        <b>${lm ? "متصل" : "مقفول"}</b></span>
      <span class="pod"><i class="dot ${loaded.length ? "warn" : "ok"}"></i>
        <span class="ic">🧠</span><b>${loaded.length ? esc(loaded.join("، ")) : "الذاكرة فاضية"}</b></span>

async function renderProbe() {
  CFG = CFG || await api("/api/config");
  const keys = (CFG.models||[]).map(m=>({id:m.id,label:m.label||m.id,key:m.key||""}));
  $("#tab-probe").innerHTML = `
  <div class="card accent"><h3>🔬 فحص قدرات LM Studio + الموديل
      <span class="tag">دقيقة – 3 دقايق</span></h3>
    <div class="note">الفحص ده بيفعّل الموديل <b>لوحده</b>، يجرّب كل طرق إيقاف/تحديد التفكير، يسجّل أنهي اشتغل فعلاً،
      وبعدين <b>يفصله ويفرّغ الذاكرة</b>. النتيجة بتتحفظ وبتستخدم تلقائياً فى التشغيل.</div>
    <div class="row" style="margin-top:13px">
      <select id="p_model" style="max-width:430px">${keys.map(k=>`<option value="${esc(k.key)}" ${k.key?"":"disabled"}>${esc(k.label)} — ${esc(k.key||"(مفيش identifier)")}</option>`).join("")}</select>
      <label class="ck" style="margin:0"><input type="checkbox" id="p_full" checked> فحص كامل
        <span class="mut small">(minimal/low/medium/high · ميزانية 64/96/192/384)</span></label>
      <button class="act" id="p_go">▶ شغّل الفحص</button>
      <button class="ghost" id="p_clear">🗑 امسح النتيجة المحفوظة</button>
    </div>
    <div id="p_out" class="small mut" style="margin-top:11px"><span class="pill">جاهز</span></div>
  </div>
  <div id="p_cached"></div>`;
  $("#p_go").onclick = async () => {
    const key = $("#p_model").value;
    if (!key) { $("#p_out").innerHTML = `<span class="pill bad">لازم identifier للموديل — من تبويب الإعداد ← Discover</span>`;
      toast("اختار موديل الأول", "warn"); return; }
    $("#p_out").innerHTML = `<span class="pill warn">⏳ شغّال… هيتم تفعيل الموديل ثم تفريغه تلقائياً</span>`;
    $("#p_go").disabled = true;
    try { const r = await api("/api/probe", {method:"POST", headers:{"Content-Type":"application/json"},
                                             body: JSON.stringify({model_key:key, full:$("#p_full").checked})});
      $("#p_out").innerHTML = `<span class="pill ok">✔ الفحص خلص</span>`;
      const box = document.createElement("div"); box.innerHTML = renderProbeResult(r);
      $("#p_out").after(box.firstElementChild);
      toast("الفحص خلص — شوف التوصية تحت", "ok"); renderCached(); refreshStatus();
    } catch (e) { $("#p_out").innerHTML = `<span class="pill bad">${esc(e.message)}</span>`; toast(e.message, "bad", 6000); }
    $("#p_go").disabled = false;
  };
  $("#p_clear").onclick = async () => {
    const key = $("#p_model").value;
    await api("/api/probe" + (key ? "?model_key=" + encodeURIComponent(key) : ""), {method:"DELETE"});
    renderCached(); $("#p_out").innerHTML = `<span class="pill">اتمسحت</span>`; toast("اتمسحت النتيجة المحفوظة", "info");
  };
  await renderCached();
  reveal($("#tab-probe"));
}

function checkPill(ok, label) {
  if (ok === true) return `<span class="pill ok">✔ ${esc(label)}</span>`;
  if (ok === false) return `<span class="pill bad">✘ ${esc(label)}</span>`;
  return `<span class="pill warn">? ${esc(label)}</span>`;
}
function renderProbeResult(r) {
  const c = r.checks || {}, rec = r.recommendation || {};
  const nOff = (r.thinking_off||[]).filter(x=>x.silenced).length;

function setPhase(n) {

}

async function loadCompare(runId) {

  else { try { SUMMARY = await api(`/api/runs/${runId}/summary`); ROWS = await api(`/api/runs/${runId}/rows`); }
         catch (e) { $("#tab-compare").innerHTML = `<div class="card"><div class="bad">✘ ${esc(e.message)}</div></div>`;
           show("compare"); toast(e.message, "bad"); return; } }
  renderCompare(); show("compare");

function renderCompare() {
  CHARTS.forEach(c=>{try{c.destroy()}catch(e){}}); CHARTS = [];
  const S = SUMMARY, ov = S.overall || [], cells = S.cells || [];
  const lab = S.labels || {models:{},modes:{}};
  const L = (id, kind) => (lab[kind] && lab[kind][id]) || id;
  const suites = [...new Set(cells.map(c=>c.suite))].filter(s=>!s.startsWith("speed"));
  const combos = [...new Set(ov.map(keyOf))];
  const modelIds = [...new Set(ov.map(o=>o.model))];
  const tax = Object.fromEntries((S.think_tax||[]).map(t=>[`${t.model}·${t.mode}`, t.think_tax_x]));
  const hasChart = (typeof Chart !== "undefined");
  const hwRows = (S.hardware||[]);
  const meta = S.meta || {};
  const V = S.verdict || {};
  const C = V.counts || {};

        <div class="ahead"><b>${esc(id)}</b>
          ${diff?'<span class="pill warn">⚑ مختلف</span>':'<span class="pill ok">متطابق</span>'}
          <span class="pill vi">${esc(suite)}</span><span class="pill">${esc(mode)}</span></div>
        <div class="prompt" dir="auto">${esc((per.find(Boolean)||{}).prompt||"")}</div>
        <div class="cols">${per.map((r,i)=>{
          const acc = COL(models.indexOf(r ? r.model : ""));
          return r ? `<div class="answercol" style="--acc:${acc}">
          <div class="who"><b style="color:${acc}">${esc(L(r.model,"models"))}</b>
            <span class="scorebadge" style="background:${heatSoft(r.score||0)};color:${heat(r.score||0)}">
              ${r.score===null||r.score===undefined?"–":fmt(r.score,2)}</span></div>
          <div class="mut small" dir="auto">${esc(String(r.detail||"").slice(0,120))}</div>
          ${r.mode_violation?`<span class="pill warn">⚠ ${esc(r.mode_violation)}</span>`:""}
          ${r.unfinished?`<span class="pill bad">unfinished</span>`:""}
          ${r.error?`<span class="pill bad">${esc(String(r.error).slice(0,60))}</span>`:""}
          <div class="metrics">
            <span class="m">TTFT ${fmt(r.ttft_s)}ث</span><span class="m">إجابة ${fmt(r.t_answer_s)}ث</span>
            <span class="m">كامل ${fmt(r.total_s)}ث</span><span class="m">${fmt(r.decode_tps,1)} tok/s</span>
            <span class="m">رد ${esc(r.completion_tokens??0)} tok</span>
            <span class="m">تفكير ≈${esc(r.think_tokens_est??0)}</span>
            <span class="m" dir="ltr">${esc(r.method||"")}</span></div>
          <div class="ans" dir="auto">${esc(r.answer||"")}</div>
          ${r.thinking?`<details><summary>🧠 التفكير (${(r.thinking||"").length} حرف)</summary>
            <pre class="thinkbox" dir="auto">${esc(r.thinking)}</pre></details>`:""}
        </div>` : `<div class="answercol"><div class="who mut">مفيش نتيجة</div></div>`;}).join("")}</div></div>`;
    }).join("");
    $("#v_list").innerHTML = html || `<div class="card"><div class="mut">مفيش صفوف للفلتر ده.</div></div>`;
    $("#v_count").textContent = `${shown} اختبار`;
  };
  $("#v_suite").onchange = draw; $("#v_mode").onchange = draw; $("#v_diff").onchange = draw; draw();
  reveal($("#tab-compare"));
}

function bootChrome() {
  const t = $("#theme");
  if (t) { t.textContent = document.documentElement.dataset.theme === "dark" ? "🌙" : "☀️";
    t.onclick = () => { const nx = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(nx); try { localStorage.setItem("bench-theme", nx); } catch (e) {} }; }
  const tt = $("#totop");
  if (tt) { addEventListener("scroll", () => tt.classList.toggle("on", scrollY > 620), { passive: true });
    tt.onclick = () => scrollTo({ top: 0, behavior: "smooth" }); }
  themeCharts();
  if (EMB) {
    const S = EMB.summary || {}, meta = S.meta || {};
    const rb = $("#reportbar");
    if (rb) { rb.hidden = false;
      rb.innerHTML = `<span>📄 <b>تقرير محفوظ</b></span>
        <span>run: <b dir="ltr">${esc(S.run_id||"")}</b></span>
        <span>البروفايل: <b>${esc(meta.profile||"")}</b></span>
        <span>الاختبارات: <b>${esc(meta.n_tests||"")}</b></span>
        <span>الحالة: <b>${esc(meta.status||"")}</b></span>
        ${meta.finished ? `<span>التاريخ: <b dir="ltr">${esc(String(meta.finished).slice(0,19).replace("T"," "))}</b></span>` : ""}
        <button class="ghost small noprint" onclick="window.print()" style="margin-inline-start:auto">🖨 اطبع / PDF</button>`; }
  }
}
/* ============================ CALIB LAB ============================ */
const TIER_LABEL = {chat:"دردشة", onestep:"حساب خطوة", multistep:"حساب متعدد الخطوات",
                    logic:"منطق", compound:"مسألة مركّبة"};
let CALIB_TIMER = null;
async function renderCalib() {
  if (EMB) { $("#tab-calib").innerHTML = ""; return; }
  CFG = CFG || await api("/api/config");
  const cal = CFG.calibration || {};
  const list = await api("/api/calibrate");
  $("#tab-calib").innerHTML = `
  <div class="card"><h3>🧪 معمل المعايرة
      <span class="tag">أصغر سقف يشبع — مش أكبر سقف</span></h3>
    <div class="mut small" dir="auto">سلّم 15 درجة (48→640) ببحث متكيف على 5 صعوبات: مرور خشن ←
      تنعيم حولين الركبة ← تكرارات عند نقطة التشبع. وبيقيس أثر التفكير نفسه:
      <b>cap-binding</b> (هل التفكير الفعلى وصل السقف؟)، <b>نسبة تكرار الـ5-grams</b> (بيلفّ؟)،
      و<b>صحة القيمة جوه التفكير</b> قبل القطع. النتيجة: توصية سلّم لكل موديل تتطبق على الـconfig بتأكيدك.</div>
    <div class="grid2" style="margin-top:12px">
      <div><div class="subhead">الموديلات (ترتيب تسلسلي: تحميل ← معايرة ← فصل كامل)</div>
        ${(CFG.models||[]).map(m=>`<label class="ck"><input type="checkbox" class="cb_m" value="${esc(m.id)}" ${m.key?"checked":"disabled"}>
          ${esc(m.label||m.id)} <span class="mut small num" dir="ltr">${esc(m.key||"")}</span></label>`).join("")}
      </div>
      <div><div class="subhead">باراميترات الجولة</div>
        <div class="grid2">
          <label class="ck">بروفايل السياق
            <select id="cb_ctx" class="inp"><option value="bare">عارى — الأسئلة بس</option>
              <option value="production" ${cal.context==="production"?"selected":""}>إنتاجى — system+tools من الـdump</option></select></label>
          <label class="ck">محاولات/خلية <input id="cb_reps" class="inp num" dir="ltr" type="number" min="1" max="8" value="${cal.reps||3}"></label>
          <label class="ck">محاولات الركبة <input id="cb_knee" class="inp num" dir="ltr" type="number" min="2" max="12" value="${cal.reps_knee||6}"></label>
          <label class="ck">حد الطلبات <input id="cb_max" class="inp num" dir="ltr" type="number" min="20" max="2000" value="${cal.max_requests||160}"></label>
        </div></div>
    </div>
    <div style="margin-top:10px"><button class="act" id="cb_go">▶ ابدأ المعايرة</button>
      <span class="mut small">ثمن الجولة ≈ 100–160 طلب للموديل — مرة واحدة، وبعدها كاش</span></div>
  </div>
  <div class="card" id="cb_prog" hidden><h3>⏳ المعايرة شغالة</h3>
    <div class="prog"><i id="cb_bar"></i></div>
    <div class="mut small" id="cb_lab" dir="auto">…</div></div>
  <div id="cb_doc"></div>
  <div class="card"><h3>🗄 معايرات محفوظة (كاش)</h3>
    ${(list.cached||[]).length ? `<div class="grid">${list.cached.map(c=>`<label class="ck">
        <input type="radio" name="cb_pick" value="${esc(c.calib_id)}">
        <b class="num" dir="ltr">${esc(c.calib_id)}</b> · ${esc(c.model_id||"")} · ${esc(c.context||"")} ·
        ${esc(c.status||"")} · ${c.requests||0} طلب</label>`).join("")}</div>
      <button class="ghost" id="cb_open">📂 افتح المختارة</button>`
      : `<div class="mut small">مفيش لسه — أول جولة بتتبنا هنا.</div>`}
  </div>`;
  $("#cb_go").onclick = startCalib;
  const op = $("#cb_open");
  if (op) op.onclick = async () => {
    const r = document.querySelector('input[name="cb_pick"]:checked');
    if (r) showCalibDoc(await api(`/api/calibrate/${r.value}`));

}
async function startCalib() {
  const models = $$(".cb_m:checked").map(x=>x.value);
  if (!models.length) { toast("اختار موديل واحد على الأقل", "bad"); return; }
  const j = await api("/api/calibrate", {method:"POST", body: JSON.stringify({models,
    context: $("#cb_ctx").value, reps:+$("#cb_reps").value,
    reps_knee:+$("#cb_knee").value, max_requests:+$("#cb_max").value})});
  $("#cb_prog").hidden = false;
  clearInterval(CALIB_TIMER);
  CALIB_TIMER = setInterval(async () => {
    let d; try { d = await api(`/api/calibrate/${j.calib_id}`); } catch (e) { return; }
    const pr = d.progress || {}, tot = Math.max(1, pr.total||1);
    $("#cb_bar").style.width = Math.min(100, 100*(pr.done||0)/tot) + "%";
    $("#cb_lab").textContent = `${pr.label||""} — ${pr.done||0}/${pr.total||"؟"}`;
    if (d.status === "done" || d.status === "error") {
      clearInterval(CALIB_TIMER); $("#cb_prog").hidden = true;
      if (d.status === "done") showCalibDoc(d); else toast(d.error || "فشل المعايرة", "bad");
    }
  }, 1200);
}
function calibTierTable(tiers) {
  const tids = Object.keys(tiers);
  return `<div class="tbl-wrap"><table><thead><tr><th>الصعوبة</th><th>b* (نقطة التشبع)</th>
    <th>الحالة</th><th>دقة عند b*</th><th>cap-binding</th><th>لفّ</th><th>الأثر قبل القطع</th><th>ملاحظات</th></tr></thead>
    <tbody>${tids.map(t=>{ const T=tiers[t]||{}, r=(T.curve||[]).find(x=>x.budget===T.b_star)||{};
      return `<tr><td><b>${esc(TIER_LABEL[t]||t)}</b></td>
      <td class="num">${T.b_star?`<span class="scorebadge" style="background:${heatSoft(.95)};color:${heat(.95)}">${T.b_star}</span>`:"—"}</td>
      <td>${T.flag==="ok"?'<span class="pill ok">مشبع ✔</span>':T.flag==="unsaturated"?'<span class="pill warn">ماثبتش</span>':T.flag==="unsolvable"?'<span class="pill bad">فشل كله</span>':'<span class="pill">مفيش أسئلة</span>'}</td>
      <td class="num">${r.acc!=null?(100*r.acc).toFixed(0)+"%":"—"}</td>
      <td class="num">${r.cap_ratio!=null?(100*r.cap_ratio).toFixed(0)+"%":"—"}</td>
      <td class="num">${r.loop_med!=null?(100*r.loop_med).toFixed(0)+"%":"—"}</td>
      <td class="num">${r.trace_rate!=null?(100*r.trace_rate).toFixed(0)+"%":"—"}</td>
      <td class="mut small" dir="auto">${esc((T.notes||[]).join(" · "))}</td></tr>`;}).join("")}
    </tbody></table></div>`;
}
function calibCurveTable(tiers) {
  return `<div class="tbl-wrap"><table><thead><tr><th>الصعوبة</th><th>السقف</th><th>ن</th><th>دقة</th>
    <th>CI 95%</th><th>تفكير فعلي (وسيط)</th><th>cap_ratio</th><th>ربط</th><th>لفّ</th><th>أثر✔</th><th>زمن وسيط</th></tr></thead>
    <tbody>${Object.entries(tiers).map(([t,T])=>(T.curve||[]).map(r=>`<tr>
      <td>${esc(TIER_LABEL[t]||t)}</td><td class="num">${r.budget}</td><td class="num">${r.n}</td>
      <td class="num" style="color:${heat(r.acc||0)};font-weight:800">${(100*r.acc).toFixed(0)}%</td>
      <td class="num mut">${(100*r.ci_low).toFixed(0)}–${(100*r.ci_high).toFixed(0)}</td>
      <td class="num">${r.think_med??0}</td><td class="num">${(100*(r.cap_ratio||0)).toFixed(0)}%</td>
      <td class="num">${r.cap_binding||0}/${r.n}</td><td class="num">${(100*(r.loop_med||0)).toFixed(0)}%</td>
      <td class="num">${(100*(r.trace_rate||0)).toFixed(0)}%</td><td class="num">${fmt(r.lat_med,1)}ث</td></tr>`).join("")).join("")}
    </tbody></table></div>`;
}
async function showCalibDoc(d) {
  const M = Object.values(d.models||{})[0] || {};
  const tiers = M.tiers || {};
  let pr = null;
  try { pr = await api(`/api/calibrate/${d.calib_id}/proposal`); } catch (e) {}
  $("#cb_doc").innerHTML = `
  <div class="card"><h3>🎯 منحنى التشبع <span class="tag num" dir="ltr">${esc(d.calib_id)}</span>
    <span class="tag">${esc(M.model_id||"")} · ${esc(d.context||"")} · ${M.requests||0} طلب · ${M.elapsed_s||0}ث</span></h3>
    <div class="grid2"><div class="chart sm"><canvas id="cbAcc"></canvas></div>
      <div class="chart sm"><canvas id="cbCap"></canvas></div></div>
    ${calibTierTable(tiers)}
    <details class="vsec"><summary><span class="ar">▶</span> <b>المنحنى الكامل لكل درجة</b></summary>
      <div class="vbody">${calibCurveTable(tiers)}</div></details>
  </div>
  ${pr?`<div class="card"><h3>📐 التوصية: سلّم الأوضاع الجديد
      <span class="tag">اقتراح — مش بيتطبق من غير تأكيدك</span></h3>
    <div class="tbl-wrap"><table><thead><tr><th>الوضع</th><th>السقف الحالي</th>
      ${Object.keys(d.models||{}).map(m=>`<th>توصية ${esc(m)}</th>`).join("")}</tr></thead>
      <tbody>${pr.rows.map(r=>`<tr><td><b>${esc(r.label)}</b></td>
        <td class="num">${r.old_budget}</td>
        ${Object.keys(d.models||{}).map(m=>{const b=r.per_model[m];
          const ch = b!=null && b!==r.old_budget;
          const cell = b == null ? '<span class="mut">—</span>'
            : '<b style="color:' + (ch ? "var(--okfg)" : "var(--mut)") + '">' + b + '</b>' +
              (ch ? ' <span class="pill ' + (b > r.old_budget ? "warn" : "ok") + '">' +
                    (b > r.old_budget ? "▲" : "▼") + ' ' + Math.abs(b - r.old_budget) + '</span>' : '');
          return '<td class="num">' + cell + '</td>';}).join("")}
        </tr>`).join("")}</tbody></table></div>
    <div class="mut small" dir="auto">${esc(pr.note)}</div>
    <div style="margin-top:10px">
      <select id="cb_apply_model" class="inp" style="max-width:260px">
        ${Object.keys(d.models||{}).map(m=>`<option value="${esc(m)}" ${m==="tuned"?"selected":""}>تطبيق توصية ${esc(m)}</option>`).join("")}
      </select>
      <button class="act" id="cb_apply">✔ طبّق على config.yaml</button>
      <span class="mut small">بينشأ config.yaml.bak-calib قبل التعديل</span></div>
  </div>`:""}`;
  drawCalibCharts(d);
  const ab = $("#cb_apply");
  if (ab) ab.onclick = async () => {
    const r = await api(`/api/calibrate/${d.calib_id}/apply`,
      {method:"POST", body: JSON.stringify({model_id: $("#cb_apply_model").value})});
    toast("اتطبق ✔ النسخة الاحتياطية: " + r.backup, "ok");
    CFG = null; try { await renderSetup(); } catch (e) {} renderCalib();
  };
  reveal($("#cb_doc"));
}
function drawCalibCharts(d) {
  if (typeof Chart === "undefined") return;
  const M = Object.values(d.models||{})[0] || {};
  const tiers = M.tiers || {};
  const budgets = [...new Set(Object.values(tiers).flatMap(T=>(T.curve||[]).map(r=>r.budget)))].sort((a,b)=>a-b);
  if (!budgets.length) return;
  const ds = (get, title, pct) => Object.entries(tiers).map(([t,T],i)=>({
    label: TIER_LABEL[t]||t, data: budgets.map(b=>{const r=(T.curve||[]).find(x=>x.budget===b);
      return r==null?null:(pct?100*get(r):get(r));}),
    borderColor: COL(i), backgroundColor: COL(i)+"33", spanGaps: true, tension:.25, pointRadius:3}));
  const mk = (sel, data, title, pct) => new Chart($(sel), {type:"line",
    data:{labels:budgets, datasets:data},
    options:{plugins:{title:TITLE(title), legend:{labels:{color:"#c3cde2", font:{size:11}}}},
      scales:{x:AX("السقف (توكن تفكير)"), y:pct?Object.assign(AX("%"),{max:100}):AX("")}}});
  CHARTS.push(mk("#cbAcc", ds(r=>r.acc, "", true), "الدقة × السقف — فين الركبة؟", true));
  CHARTS.push(mk("#cbCap", ds(r=>r.cap_ratio, "", true), "cap-binding: التفكير الفعلى ÷ السقف (فوق 90% = السقف هو الحد)", true));
}
function renderCalibSection(S) {
  const box = $("#calibSec"); if (!box || !(S.calibration||[]).length) return;
  box.innerHTML = (S.calibration||[]).map((c,ci)=>{
    const tiers = c.tiers || {};
    return `<div class="subhead">${esc(c.model_id||"")} · <span class="num" dir="ltr">${esc(c.calib_id)}</span> · ${esc(c.context||"")}</div>
    <div class="grid">${Object.entries(tiers).map(([t,T])=>`<div class="kpi" style="--acc:linear-gradient(135deg,#22d3ee,#14b8a6)">
      <div class="k-lab">${esc(TIER_LABEL[t]||t)}</div>
      <div class="k-val" style="color:${T.b_star?"var(--okfg)":"var(--mut)"}">${T.b_star||"–"}<span style="font-size:13px"> توكن</span></div>
      <div class="k-sub">${T.flag==="ok"?'<span class="pill ok">مشبع ✔</span>':T.flag==="unsaturated"?'<span class="pill warn">ماثبتش</span>':'<span class="pill bad">فشل</span>'}</div></div>`).join("")}</div>
    <div class="chart sm"><canvas id="chCal${ci}"></canvas></div>`;}).join("");
  if (typeof Chart === "undefined") return;
  (S.calibration||[]).forEach((c,ci)=>{
    const tiers = c.tiers || {};
    const budgets = [...new Set(Object.values(tiers).flatMap(T=>(T.curve||[]).map(r=>r.budget)))].sort((a,b)=>a-b);
    if (!budgets.length) return;
    CHARTS.push(new Chart($("#chCal"+ci), {type:"line",
      data:{labels:budgets, datasets:Object.entries(tiers).map(([t,T],i)=>({
        label:TIER_LABEL[t]||t, spanGaps:true, tension:.25, pointRadius:3,
        borderColor:COL(i), backgroundColor:COL(i)+"33",
        data:budgets.map(b=>{const r=(T.curve||[]).find(x=>x.budget===b); return r?100*r.acc:null;})}))},
      options:{plugins:{title:TITLE("الدقة × السقف (معايرة "+(c.model_id||"")+")"),
        legend:{labels:{color:"#c3cde2", font:{size:11}}}},
        scales:{x:AX("السقف"), y:Object.assign(AX("%"),{max:100})}}}));
  });
}

(async function () {
  bootChrome();
  if (EMB) { buildNav([["compare","المقارنة"]]); await loadCompare(null); return; }

  try { await renderProbe(); } catch (e) {}
  try { await renderCalib(); } catch (e) {}
  show("setup"); refreshStatus(); setInterval(refreshStatus, 15000);
